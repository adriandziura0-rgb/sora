name: Inspect Android test evidence
on:
  push:
    branches: [sora-pdf-diagnostics]
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read synthetic test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/adriandziura0-rgb/sora/actions/artifacts/11473136266/zip --output /tmp/sora-evidence.zip
          python - <<'PY'
          import zipfile, base64, re
          with zipfile.ZipFile('/tmp/sora-evidence.zip') as archive:
              for name in ('last-native.xml', 'web-state.json', 'logcat.txt'):
                  matches = [p for p in archive.namelist() if p.endswith(name)]
                  if not matches:
                      continue
                  text = archive.read(matches[0]).decode('utf-8', errors='replace')
                  if name == 'logcat.txt':
                      text = '\n'.join(line for line in text.splitlines() if re.search(r'print|chromium|Exception|FATAL|WebView|javascript', line, re.I))
                  print('EVIDENCE_' + name + '\n' + text)
              png = next(p for p in archive.namelist() if p.endswith('android-failure.png'))
              print('EVIDENCE_PNG_BASE64=' + base64.b64encode(archive.read(png)).decode('ascii'))
          PY
