name: Build Sora Windows native EXE
on:
  workflow_dispatch:
  push:
    branches: [main, 'desktop-native-*']
    paths:
      - 'desktop/**'
      - 'app/src/main/python/data_transfer.py'
      - 'tools/test_transfer.py'
      - 'app/src/main/assets/drogowskazy-runtime.zip'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
concurrency:
  group: sora-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install Flask==3.1.2 pyinstaller==6.16.0 reportlab==4.4.4 Pillow==11.3.0
      - name: Verify identical PHONE and PC engine and results
        run: python desktop/test_engine.py
      - name: Verify transfer merge and safety
        run: python tools/test_transfer.py
      - name: Build Windows application
        run: python desktop/build_windows.py
      - name: Verify installed native window and engine
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP 'sora-exe-smoke'
          $process = Start-Process -FilePath '.\dist\Sora\Sora.exe' -ArgumentList @('--smoke-test', '--data-dir', $testData) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Native EXE test timed out' }
          if ($process.ExitCode -ne 0) { throw "Native EXE returned $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $testData 'smoke-ok.json'))) { throw 'Native analysis did not complete' }
          $before = Get-FileHash (Join-Path $testData 'data\drogowskazy.sqlite3')
          $process = Start-Process -FilePath '.\dist\Sora\Sora.exe' -ArgumentList @('--smoke-test', '--data-dir', $testData) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Native EXE restart timed out' }
          if ($process.ExitCode -ne 0) { throw 'Native EXE restart failed' }
          Copy-Item (Join-Path $testData 'smoke-ok.json') '.\dist\Sora\TEST_OK.json'
          Copy-Item (Join-Path $testData 'SORA_WYNIK.png') '.\dist\Sora\PODGLAD.png'
      - name: Package Windows version
        shell: pwsh
        run: Compress-Archive -Path dist\Sora -DestinationPath Drogowskazy_Sora_PC_NATIVE_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sora-PC-NATIVE-WINDOWS
          path: Drogowskazy_Sora_PC_NATIVE_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Sora-PC-test-diagnostics
          path: ${{ runner.temp }}/sora-exe-smoke/
