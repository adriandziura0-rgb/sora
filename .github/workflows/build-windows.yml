name: Build Sora PC Native WebView2 PHONE
on:
  workflow_dispatch:
  push:
    branches: [main, 'desktop-native-*', 'sora-full-*']
    paths:
      - 'desktop/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'VERSION.txt'
      - 'app/src/main/python/data_transfer.py'
      - 'tools/**'
      - 'runtime_source/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
concurrency:
  group: sora-windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test syntax and PHONE folder bridge
        run: |
          python -m py_compile desktop/sora_backend.py desktop/engine.py desktop/local_session.py desktop/build_native_windows.py
          node desktop/test_windows_adapter.mjs
          python tools/test_native_clean.py
          node tools/test_import_recovery.mjs
      - name: Install only Python engine dependencies
        run: python -m pip install Flask==3.1.2 pyinstaller==6.16.0 reportlab==4.4.4 Pillow==11.3.0
      - name: Build identical runtime from CLEAN source files
        run: python tools/build_runtime_from_sources.py
      - name: Test original PHONE engine and SQLite safety
        run: |
          python tools/test_canonical_runtime.py
          python tools/test_full_database_overview.py
          python tools/test_shared_content.py
          python tools/test_quote_database.py
          python tools/test_topic_matcher_cache.py
          python desktop/test_engine.py
          python desktop/test_local_session.py
          python tools/test_transfer.py
      - name: Build native C# WebView2 and headless PHONE backend
        run: python desktop/build_native_windows.py
      - name: Check backend executable without GUI Python libraries
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'sora-backend-selftest'
          $exe = '.\dist\Sora\_engine\SoraSilnik\SoraSilnik.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--data-dir', $data) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Backend timed out' }
          if ($p.ExitCode -ne 0) { throw "Backend failed: $($p.ExitCode)" }
          if (Test-Path '.\dist\Sora\_engine\SoraSilnik\_internal\pythonnet') { throw 'Pythonnet was included' }
          if (Test-Path '.\dist\Sora\_engine\SoraSilnik\_internal\PyQt6') { throw 'Qt was included' }
      - name: Test REAL WinForms WebView2 window and PHONE UI
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'sora-webview2-test'
          $p = Start-Process -FilePath '.\dist\Sora\Sora.exe' -ArgumentList @('--test-ui', '--test-background', '--data-dir', $data) -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'WebView2 timed out' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path (Join-Path $data 'blad_okna_webview2.txt')) { Get-Content (Join-Path $data 'blad_okna_webview2.txt') }
            if (Test-Path (Join-Path $data 'blad_silnika_pc.txt')) { Get-Content (Join-Path $data 'blad_silnika_pc.txt') }
            throw "WebView2 failed: $($p.ExitCode)"
          }
          $report = Join-Path $data 'OK_PRAWDZIWE_OKNO.json'
          $preview = Join-Path $data 'PODGLAD_PRAWDZIWEGO_OKNA.png'
          if (-not (Test-Path $report) -or -not (Test-Path $preview)) { throw 'No real native GUI test result' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.window -ne 'WebView2 native' -or -not $result.phone -or
              -not $result.backgroundVerified -or -not $result.watchdogRestartVerified) {
            throw 'GUI background or watchdog regression'
          }
          Copy-Item $report '.\dist\Sora\TEST_OK_PRAWDZIWE_OKNO.json'
          Copy-Item $preview '.\dist\Sora\PODGLAD_PRAWDZIWEGO_OKNA.png'
      - name: Pack native Sora
        shell: pwsh
        run: Compress-Archive -Path dist\Sora -DestinationPath Sora_PHONE_NATYWNA_WEBVIEW2_PC.zip
      - name: Extract published ZIP and test the REAL window once again
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'sora-clean-extract'
          Expand-Archive -Path Sora_PHONE_NATYWNA_WEBVIEW2_PC.zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'Sora\Sora.exe'
          if (-not (Test-Path $exe)) { throw 'No Sora.exe in ZIP' }
          $data = Join-Path $env:RUNNER_TEMP 'sora-extracted-ui-test'
          $p = Start-Process -FilePath $exe -ArgumentList @('--test-ui', '--test-background', '--data-dir', $data) -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'Extracted UI timeout' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path (Join-Path $data 'blad_okna_webview2.txt')) { Get-Content (Join-Path $data 'blad_okna_webview2.txt') }
            throw "Extracted UI failed: $($p.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $data 'OK_PRAWDZIWE_OKNO.json'))) { throw 'No extracted UI pass' }
          $state = Get-Content (Join-Path $data 'OK_PRAWDZIWE_OKNO.json') -Raw | ConvertFrom-Json
          if (-not $state.backgroundVerified -or -not $state.watchdogRestartVerified) {
            throw 'Extracted Sora failed background/restart test'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Sora-WINDOWS-NATIVE-WEBVIEW2
          path: Sora_PHONE_NATYWNA_WEBVIEW2_PC.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Sora-WINDOWS-UI-ERRORS
          path: |
            ${{ runner.temp }}/sora-webview2-test/
            ${{ runner.temp }}/sora-extracted-ui-test/
            ${{ runner.temp }}/sora-backend-selftest/
