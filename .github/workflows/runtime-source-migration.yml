name: CLEAN Stage 3 Canonical Source Migration
on:
  push:
    branches: ['sora-full-clean-stage3-*']
    paths:
      - '.github/workflows/runtime-source-migration.yml'
permissions:
  contents: write
jobs:
  migrate_once:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce exact proven runtime 1.2.13
        run: |
          python tools/patch_engine_runtime.py
          python tools/patch_full_database_dashboard.py
          python tools/migrate_runtime_sources.py
      - name: Store canonical source files in dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runtime_source/
          git diff --cached --quiet && exit 0
          git commit -m "CLEAN stage 3: exact audited runtime sources; no engine changes"
          git push origin HEAD:sora-full-clean-stage3-20261015
