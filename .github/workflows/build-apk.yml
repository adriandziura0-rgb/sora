name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'desktop-native-*', 'sora-full-*' ]

permissions:
  contents: read

concurrency:
  group: sora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Optimize analysis engine without changing file downloads
        run: python tools/patch_engine_runtime.py

      - name: Enable read-only whole-database reports
        run: python tools/patch_full_database_dashboard.py

      - name: Verify bundled program and installer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Flask==3.1.3
          python tools/test_project_store.py
          node tools/test_native_panel.mjs
          python tools/test_runtime.py
          python tools/test_transfer.py
          python tools/test_topic_matcher_cache.py
          python tools/test_full_database_overview.py

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;35.0.0"

      - name: Restore stable APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sora-android-signing-v1

      - name: Ensure stable APK signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            echo "Brak istniejącego klucza Sora 1.2.1. Przerwano, aby zachować zgodność aktualizacji."
            exit 1
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Valid from:"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Drogowskazy-Sora-1.2.7.apk

      - name: Verify APK signature and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Drogowskazy-Sora-1.2.7.apk | tee apk-verification.txt
          grep -q '24ff96996dd176159eb71e1557cf7da9fa720382870b78b42ffa76114b7a4339' apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Drogowskazy-Sora-1.2.7.apk > apk-badging.txt
          grep -q "versionCode='10' versionName='1.2.7'" apk-badging.txt
          head -n 5 apk-badging.txt
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('Drogowskazy-Sora-1.2.7.apk') as apk:
              assert apk.testzip() is None
              assert 'assets/drogowskazy-runtime.zip' in apk.namelist()
              assert 'assets/native-panel.js' in apk.namelist()
              assert apk.read('assets/drogowskazy-runtime.zip') == open('app/src/main/assets/drogowskazy-runtime.zip', 'rb').read()
          print('PASS: APK CRC, embedded runtime and native panel assets')
          PY

      - name: Prepare real Android panel tests
        run: |
          python tools/test_transfer.py --fixture test-output/input/Sora-tests/pc-transfer.zip
          npm install --no-save --no-package-lock playwright@1.56.1
          gradle --no-daemon --stacktrace -PsoraTestAbi=x86_64 :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test all panel buttons and Android file pickers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node tools/test_android.mjs

      - name: Verify real PHONE export imports into PC
        run: python tools/test_transfer.py --verify-phone test-output/audit-phone-transfer.zip

      - name: Upload Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sora-Android-tests
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drogowskazy-Sora-APK
          path: Drogowskazy-Sora-1.2.7.apk
          if-no-files-found: error
          retention-days: 30
