plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'pl.drogowskazy.sora'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.drogowskazy.sora'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install("Flask==3.1.3")
        }
    }
}
