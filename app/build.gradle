plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'pl.drogowskazy.sora'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.drogowskazy.sora'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.2.3'

        ndk {
            abiFilters (project.findProperty('soraTestAbi') ?: 'arm64-v8a')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile new File(System.getProperty("user.home"), ".android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install("Flask==3.1.3")
        }
    }
}
